name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DJANGO_SECRET_KEY: ci-insecure-key-for-testing-only
  DJANGO_DEBUG: "False"
  DJANGO_DB_ENGINE: django.db.backends.postgresql
  DJANGO_DB_NAME: spkb
  DJANGO_DB_USER: spkb
  DJANGO_DB_PASSWORD: ci_test_password
  DJANGO_DB_HOST: localhost
  DJANGO_DB_PORT: 5432
  DJANGO_DB_SSLMODE: prefer
  DJANGO_CACHE_BACKEND: django.core.cache.backends.locmem.LocMemCache
  DJANGO_CACHE_LOCATION: unique
  DJANGO_EMAIL_VERIFICATION_REQUIRED: "false"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  DJANGO_CORS_ALLOWED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
  DJANGO_SUPERUSER_USERNAME: admin
  DJANGO_SUPERUSER_EMAIL: admin@spkb.test
  DJANGO_SUPERUSER_PASSWORD: '@Admin1234'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run ruff
        run: ruff check backend/

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spkb
          POSTGRES_USER: spkb
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U spkb
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: ./backend
        run: python manage.py test attendance --noinput

  test-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spkb
          POSTGRES_USER: spkb
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U spkb
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Prepare database
        working-directory: ./backend
        run: |
          python manage.py migrate --noinput
          python manage.py createsuperuser --noinput --skip-checks || true
      - name: Run Playwright E2E tests
        run: npx playwright test
