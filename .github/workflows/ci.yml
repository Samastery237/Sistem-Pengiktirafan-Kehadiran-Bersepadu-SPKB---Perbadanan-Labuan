name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_DEBUG: 'False'
  DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1'
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME || 'spkb' }}/spkb

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev pkg-config meson python3-dev
        PKG_DIR=$(python3 -c "import sysconfig; print(sysconfig.get_path('data') + '/lib/pkgconfig')")
        if [ -f /usr/lib/x86_64-linux-gnu/pkgconfig/cairo.pc ] && [ -d "$PKG_DIR" ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/pkgconfig/cairo.pc "$PKG_DIR/cairo.pc"
        fi

    - name: Install Python dependencies
      working-directory: ./backend
      env:
        PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      working-directory: ./backend
      run: pip install ruff && ruff check .

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libcairo2-dev pkg-config meson python3-dev
        # pycairo's meson build overrides PKG_CONFIG_PATH with Python's own
        # pkgconfig dir, so we symlink cairo.pc into that directory
        PKG_DIR=$(python3 -c "import sysconfig; print(sysconfig.get_path('data') + '/lib/pkgconfig')")
        if [ -f /usr/lib/x86_64-linux-gnu/pkgconfig/cairo.pc ] && [ -d "$PKG_DIR" ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/pkgconfig/cairo.pc "$PKG_DIR/cairo.pc"
        fi

    - name: Install Python dependencies
      working-directory: ./backend
      env:
        PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Django can start
      working-directory: ./backend
      env:
        DJANGO_DEBUG: 'True'
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-secret-key-for-github-actions-minimum-50-chars-long-ok' }}
      run: python manage.py check --deploy 2>&1 || python manage.py check 2>&1 || true

    - name: Debug test failure
      working-directory: ./backend
      env:
        DJANGO_DEBUG: 'True'
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-secret-key-for-github-actions-minimum-50-chars-long-ok' }}
      run: |
        python -c "
import sys, os, django
os.environ['DJANGO_SECRET_KEY'] = 'test-key'
sys.path.insert(0, '.')
os.environ['DJANGO_SETTINGS_MODULE'] = 'backend.settings'
import django
django.setup()
print('Django setup OK, version:', django.VERSION)
from django.conf import settings
print('DEBUG:', settings.DEBUG)
print('ALLOWED_HOSTS:', settings.ALLOWED_HOSTS)
print('SECURE_SSL_REDIRECT:', settings.SECURE_SSL_REDIRECT)
print('SESSION_COOKIE_SECURE:', settings.SESSION_COOKIE_SECURE)
" 2>&1 | tail -20

    - name: Run Django Tests
      working-directory: ./backend
      env:
        DJANGO_DEBUG: 'True'
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-secret-key-for-github-actions-minimum-50-chars-long-ok' }}
      run: python manage.py test --failfast 2>&1 | tee /tmp/django_test_output.txt

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: django-test-output
        path: /tmp/django_test_output.txt --failfast 2>&1 | tail -50

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libcairo2-dev pkg-config meson python3-dev
        # pycairo's meson build overrides PKG_CONFIG_PATH with Python's own
        # pkgconfig dir, so we symlink cairo.pc into that directory
        PKG_DIR=$(python3 -c "import sysconfig; print(sysconfig.get_path('data') + '/lib/pkgconfig')")
        if [ -f /usr/lib/x86_64-linux-gnu/pkgconfig/cairo.pc ] && [ -d "$PKG_DIR" ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/pkgconfig/cairo.pc "$PKG_DIR/cairo.pc"
        fi

    - name: Install Python dependencies
      working-directory: ./backend
      env:
        PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci || npm install

    - name: Cache Playwright browsers
      id: cache-playwright
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Django Migrations
      working-directory: ./backend
      env:
        DJANGO_DEBUG: 'True'
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-secret-key-for-github-actions-minimum-50-chars-long-ok' }}
      run: |
        python manage.py makemigrations
        python manage.py migrate
        python manage.py createcachetable || true

    - name: Set E2E test credentials
      working-directory: ./backend
      env:
        DJANGO_DEBUG: 'True'
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-secret-key-for-github-actions-minimum-50-chars-long-ok' }}
      run: |
        python manage.py createsuperuser --noinput --username admin --email admin@example.com --skip-checks || true
        python manage.py shell -c "from django.contrib.auth.models import User; u=User.objects.get(username='admin'); u.set_password('admin123'); u.save()"

    - name: Run E2E Tests
      run: npx playwright test

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-tests, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      if: env.DOCKER_USERNAME != ''
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ env.DOCKER_USERNAME != '' }}
        load: true
        tags: ${{ env.DOCKER_IMAGE }}:latest,${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan image for CVEs
      if: always()
      uses: aquasecurity/trivy-action@0.30.0
      with:
        image-ref: ${{ env.DOCKER_IMAGE }}:latest
        format: table
        exit-code: '1'
        severity: 'HIGH,CRITICAL'
