name: SPKB CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ─────────────────────────────────────────
  # Job 1: Lint + Security Scan
  # ─────────────────────────────────────────
  lint-and-security:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: "ci-cd-temporary-secret-key-for-testing"
      DJANGO_DEBUG: "True"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install System Dependencies for Certificate Generation
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libcairo2-dev libffi-dev libssl-dev

    - name: Install Backend Dependencies & Security Linters
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit ruff

    - name: 🧹 Run Linter (Ruff)
      run: |
        ruff check backend/

    - name: 🛡️ Run Code Security Scanner (Bandit)
      run: |
        bandit -r backend/ -ll -x "*/tests*,*/venv*"

  # ─────────────────────────────────────────
  # Job 2: Backend Tests + Coverage
  # ─────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: "ci-cd-temporary-secret-key-for-testing"
      DJANGO_DEBUG: "True"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install System Dependencies for Certificate Generation
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libcairo2-dev libffi-dev libssl-dev

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 📋 Verify Frontend Assets Exist
      run: |
        test -f frontend/index.html || (echo "❌ Missing frontend/index.html" && exit 1)
        test -f frontend/form.html || (echo "❌ Missing frontend/form.html" && exit 1)
        test -f frontend/admin.html || (echo "❌ Missing frontend/admin.html" && exit 1)
        test -f frontend/css/style.css || (echo "❌ Missing frontend/css/style.css" && exit 1)
        test -f frontend/js/form.js || (echo "❌ Missing frontend/js/form.js" && exit 1)
        test -f frontend/js/admin.js || (echo "❌ Missing frontend/js/admin.js" && exit 1)
        test -f frontend/js/theme.js || (echo "❌ Missing frontend/js/theme.js" && exit 1)
        echo "✅ All frontend assets verified"

    - name: 🔐 Run Backend Tests with Coverage
      run: |
        cd backend
        python manage.py migrate
        python -m pytest attendance/tests.py --cov=attendance --cov-report=term-missing --cov-fail-under=44

    - name: 📊 Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          backend/htmlcov/
          backend/.coverage
        retention-days: 7

  # ─────────────────────────────────────────
  # Job 3: Playwright E2E Tests
  # ─────────────────────────────────────────
  e2e-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: "ci-cd-temporary-secret-key-for-testing"
      DJANGO_DEBUG: "True"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install System Dependencies for Certificate Generation
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libcairo2-dev libffi-dev libssl-dev

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Frontend Dependencies (Playwright)
      run: |
        npm ci
        npx playwright install --with-deps

    - name: 🖥️ Setup Django & Start Backend Server
      run: |
        cd backend
        python manage.py migrate
        python manage.py createcachetable
        python manage.py shell -c "from django.contrib.auth.models import User; User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@example.com', 'admin123'); from attendance.models import Department; Department.objects.get_or_create(name='Jabatan Hal Ehwal Korporat')"
        python manage.py runserver 127.0.0.1:8000 &
        sleep 5

    - name: 🧪 Run Playwright E2E UI Tests
      run: |
        npx playwright test

    - name: 📸 Upload Playwright Report on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          test-results/
          playwright-report/
        retention-days: 14
