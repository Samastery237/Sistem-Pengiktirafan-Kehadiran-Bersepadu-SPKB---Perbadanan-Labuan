name: SPKB CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-secure:
    runs-on: ubuntu-latest
    
    # Set environment variables for the Django backend during testing
    env:
      DJANGO_SECRET_KEY: "ci-cd-temporary-secret-key-for-testing"
      DJANGO_DEBUG: "True"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install System Dependencies for Certificate Generation
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libcairo2-dev libffi-dev libssl-dev

    - name: Install Backend Dependencies & Security Linters
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit

    - name: 🛡️ Run Code Security Scanner (Bandit)
      run: |
        bandit -r backend/ -c "bandit.yaml" || bandit -r backend/

    - name: 🔐 Run Backend Security & RBAC Tests (Pytest)
      run: |
        cd backend
        python manage.py migrate
        pytest attendance/tests.py

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Frontend Dependencies (Playwright)
      run: |
        npm install
        npx playwright install --with-deps

    - name: 🖥️ Run Playwright E2E UI Tests
      run: |
        npx playwright test
