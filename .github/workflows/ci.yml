name: SPKB CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-secure:
    runs-on: ubuntu-latest
    
    # Set environment variables for the Django backend during testing
    env:
      DJANGO_SECRET_KEY: "ci-cd-temporary-secret-key-for-testing"
      DJANGO_DEBUG: "True"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install System Dependencies for Certificate Generation
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libcairo2-dev libffi-dev libssl-dev

    - name: Install Backend Dependencies & Security Linters
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit

    - name: 🛡️ Run Code Security Scanner (Bandit)
      run: |
        bandit -r backend/ -ll -x "*/tests*,*/venv*"

    - name: 🔐 Run Backend Security & RBAC Tests (Pytest)
      run: |
        cd backend
        python manage.py migrate
        pytest attendance/tests.py

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Frontend Dependencies (Playwright)
      run: |
        npm install
        npx playwright install --with-deps

    - name: 🖥️ Run Playwright E2E UI Tests
      run: |
        cd backend
        python manage.py shell -c "from django.contrib.auth.models import User; User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@example.com', 'admin123')"
        python manage.py runserver 127.0.0.1:8000 &
        sleep 5
        cd ..
        npx playwright test

  deploy-to-production:
    needs: test-and-secure
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: 🚀 Deploy to Production Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PROD_SERVER_IP }}
        username: ${{ secrets.PROD_SERVER_USER }}
        key: ${{ secrets.PROD_SSH_KEY }}
        script: |
          cd /var/www/SPKB
          git pull origin main
          docker compose -f docker-compose.yml up -d --build
          docker compose exec -w /app/backend -T web python manage.py migrate
          docker compose exec -w /app/backend -T web python manage.py collectstatic --noinput
