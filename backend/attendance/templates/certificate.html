<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }
        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
        }
        .cert-container {
            width: 100%;
            height: 100%;
            padding: 50px;
            box-sizing: border-box;
            background: #ffffff;
            border: 20px solid #1a3a5c;
            text-align: center;
        }
        .header {
            color: #c8963e;
            font-size: 40px;
            font-weight: bold;
            margin-top: 50px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .subheader {
            color: #2563a8;
            font-size: 24px;
            margin-top: 20px;
        }
        .presented-to {
            font-size: 18px;
            color: #666;
            margin-top: 60px;
        }
        .name {
            font-size: 48px;
            font-weight: bold;
            color: #1a3a5c;
            margin-top: 20px;
            border-bottom: 2px solid #c8963e;
            display: inline-block;
            padding-bottom: 10px;
        }
        .program-info {
            font-size: 20px;
            color: #333;
            margin-top: 40px;
        }
        .program-name {
            font-size: 26px;
            font-weight: bold;
            color: #1a3a5c;
            margin-top: 10px;
        }
        .date {
            font-size: 18px;
            color: #666;
            margin-top: 50px;
        }
        .signature-section {
            margin-top: 80px;
            width: 100%;
            text-align: center;
        }
        .signature-line {
            width: 300px;
            border-top: 1px solid #1a3a5c;
            margin: 0 auto;
            padding-top: 10px;
            font-weight: bold;
            color: #1a3a5c;
        }
    </style>
</head>
<body>
    <div class="cert-container">
        <div class="header">SIJIL PENGHARGAAN</div>
        <div class="subheader">Sistem Pengiktirafan Kehadiran Bersepadu</div>
        
        <div class="presented-to">Dengan ini disahkan bahawa</div>
        
        <div class="name">{{ fullname }}</div>
        
        <div class="program-info">telah hadir dengan jayanya ke program</div>
        
        <div class="program-name">{{ program }}</div>
        
        <div class="date">Tarikh: {{ date }}</div>
        
        <div class="signature-section">
            <div class="signature-line">
                Pengurusan Perbadanan Labuan
            </div>
        </div>
    </div>
</body>
</html>
