version: '3.8'

services:
  web:
    build: .
    container_name: spkb_web
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database (mounted to a directory)
      - db-data:/app/backend/data
      # Persist media uploads and generated certificates
      - media-data:/app/backend/media
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=production-secret-key-change-me-later-in-production
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - DJANGO_CACHE_BACKEND=django.core.cache.backends.locmem.LocMemCache
      - DJANGO_DB_NAME=/app/backend/data/db.sqlite3
    restart: unless-stopped
    command: >
      bash -c "python manage.py makemigrations &&
               python manage.py migrate &&
               python manage.py createcachetable &&
               python manage.py createsuperuser --noinput --username admin --email admin@example.com || true &&
               gunicorn --bind 0.0.0.0:8000 --workers 3 backend.wsgi:application"

volumes:
  db-data:
  media-data:
