networks:
  spkb-network:
    driver: bridge

services:
  web:
    build: .
    container_name: spkb_web
    ports:
      - "8000:8000"
    volumes:
      - media-data:/app/backend/media
      - static-data:/app/backend/staticfiles
    env_file:
      - backend/.env
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_DB_ENGINE=django.db.backends.postgresql
      - DJANGO_DB_NAME=spkb
      - DJANGO_DB_USER=spkb
      - DJANGO_DB_PASSWORD=${POSTGRES_PASSWORD:?Postgres password not set}
      - DJANGO_DB_HOST=db
      - DJANGO_DB_PORT=5432
      - DJANGO_DB_CONN_MAX_AGE=600
      - DJANGO_DB_SSLMODE=prefer
      - DJANGO_EMAIL_VERIFICATION_REQUIRED=false
      - DJANGO_CACHE_BACKEND=django.core.cache.backends.redis.RedisCache
      - DJANGO_CACHE_LOCATION=redis://:${REDIS_PASSWORD:?Redis password not set}@redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - spkb-network
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput --clear &&
        python manage.py createcachetable django_cache || true &&
        python manage.py createsuperuser --noinput --skip-checks || true 2>/dev/null &&
        python manage.py shell -c \"from django.contrib.auth.models import User; User.objects.filter(is_staff=True, is_active=False).update(is_active=True)\" &&
        gunicorn --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile - --worker-tmp-dir /dev/shm --forwarded-allow-ips='*' backend.wsgi:application
      "

  db:
    networks:
      - spkb-network
    image: postgres:16-alpine
    container_name: spkb_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=spkb
      - POSTGRES_USER=spkb
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Postgres password not set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spkb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: spkb_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Redis password not set}"]
    restart: unless-stopped
    networks:
      - spkb-network

  nginx:
    networks:
      - spkb-network
    build:
      dockerfile: nginx.Dockerfile
      context: .
    container_name: spkb_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static-data:/static:ro
      - media-data:/media:ro
      - ./certs/spkb.crt:/etc/ssl/certs/spkb.crt:ro
      - ./certs/spkb.key:/etc/ssl/private/spkb.key:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres-data:
  media-data:
  static-data:
