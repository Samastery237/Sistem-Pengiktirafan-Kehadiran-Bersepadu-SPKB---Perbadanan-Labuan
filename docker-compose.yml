
services:
  web:
    # Use a specific image tag for easy rollback (e.g., spkb-web:v1.0.0)
    # If a deployment fails, simply change the tag back to the previous version and run `docker-compose up -d`
    image: spkb-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn backend.wsgi:application --chdir /app/backend --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/attendance/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  static_volume:
