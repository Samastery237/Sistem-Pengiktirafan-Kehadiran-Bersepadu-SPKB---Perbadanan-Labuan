    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; text-align: center; }
    .success-card {
      max-width: 520px;
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(22,163,74,0.3);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(22,163,74,0.1);
    }
    .success-icon {
      width: 80px;
      height: 80px;
      background: rgba(22,163,74,0.15);
      border: 2px solid rgba(22,163,74,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 1.5rem;
      animation: pop 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }
    @keyframes pop {
      0% { transform: scale(0); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .success-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: #4ade80;
    }
    .success-card > p {
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .detail-table {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 2rem;
      text-align: left;
    }
    .detail-row {
      display: flex;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
      gap: 1rem;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--text-muted); min-width: 120px; font-weight: 500; flex-shrink: 0; }
    .detail-value { color: var(--text); font-weight: 600; word-break: break-all; }
    .success-actions { display: flex; flex-direction: column; gap: 0.75rem; }
    .ref-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(200,150,62,0.1);
      border: 1px solid var(--border-accent);
      color: var(--accent-light);
      font-size: 0.78rem;
      padding: 0.3rem 0.8rem;
      border-radius: 100px;
      margin-bottom: 1.5rem;
    }
    .org-top {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }
    /* Lucide Icon Alignment */
    [data-lucide], svg.lucide {
      display: inline-block;
      vertical-align: middle;
      width: 1em;
      height: 1em;
      stroke-width: 1.75;
      flex-shrink: 0;
    }
    .success-icon [data-lucide], .success-icon svg.lucide {
      width: 44px;
      height: 44px;
      color: #4ade80;
    }
    .btn [data-lucide], .btn svg.lucide {
      width: 16px;
      height: 16px;
      margin-right: 0.35rem;
      position: relative;
      top: -0.5px;
    }
    .ref-badge [data-lucide], .ref-badge svg.lucide {
      width: 14px;
      height: 14px;
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="success-card fade-in" id="success-card">

    <div class="success-icon"><i data-lucide="circle-check"></i></div>
    <h2>Kehadiran Berjaya Didaftarkan!</h2>
    <p>Attendance Successfully Registered!</p>

    <div class="ref-badge" id="ref-badge"><i data-lucide="clipboard-list"></i> Rujukan: —</div>

    <div class="detail-table" id="detail-table">
      <!-- Populated by JS -->
    </div>

    <div class="success-actions" style="margin-top: 2rem;">
      <a href="index.html" class="btn btn-primary btn-full" id="btn-home">
        <i data-lucide="home"></i> Kembali ke Laman Utama / Home
      </a>

    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>

  <script>
    const data = JSON.parse(sessionStorage.getItem('lastSubmission') || '{}');
    const rows = [
      { label: 'Nama / Name', key: 'fullname' },
      { label: 'No. IC', key: 'ic' },
      { label: 'No. Telefon', key: 'phone' },
      { label: 'E-mel / Email', key: 'email' },
      { label: 'Organisasi', key: 'organization' },
      { label: 'Tarikh / Date', key: 'timestamp' },
    ];
    const table = document.getElementById('detail-table');
    rows.forEach(r => {
      const val = data[r.key];
      if (!val) return;
      const row = document.createElement('div');
      row.className = 'detail-row';
      row.innerHTML = `<span class="detail-label">${r.label}</span><span class="detail-value">${val}</span>`;
      table.appendChild(row);
    });
    if (data.ref) {
      document.getElementById('ref-badge').textContent = 'Rujukan: ' + data.ref;
    }
    if (!data.fullname) {
      window.location.href = 'form.html';
    }
  </script>
</body>
</html>
